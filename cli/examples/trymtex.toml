include = ["**/*.tex"]
exclude = [
  "build/**",
  "_build/**",
  "out/**",
  "**/*.generated.tex",
  "**/generated/**",
]
backup = false
fail_on_warnings = false

[formatter]
format_bib = false
# latexindent_config = ".latexindent.yaml"

[fixers]
enabled = [
  "nbsp-before-ref",
  "space-before-punctuation",
]

[compile]
engine = "latexmk"
main = "main.tex"
args = ["-pdf"]

